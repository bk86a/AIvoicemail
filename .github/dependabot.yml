# Security-only: Dependabot opens PRs for vulnerability fixes, not routine version bumps.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /asterisk
    schedule:
      interval: daily
    open-pull-requests-limit: 0
