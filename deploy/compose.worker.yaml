# Processing host: the worker service, plus the "tools" profile that runs the aivoicemail CLI
# (./aivm <command>). "testcall" is a separate service (same profile/image) for `test-call` alone,
# since it needs a raw socket that `tools` and `worker` must not have.
# Single host: included by deploy/compose.yaml. Split mode: run this file alone.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:5060"
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  worker:
    <<: *hardening
    build: {context: .., dockerfile: Dockerfile}
    image: aivoicemail-worker:0.1.0
    restart: unless-stopped
    env_file: [../.env]
    # a local LLM/STT server on the Docker host (e.g. Ollama) is http://host.docker.internal:<port>;
    # generate then opens that port to the Docker bridges in the host firewall
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      AIVOICEMAIL_FAKE_PROVIDERS: ${AIVOICEMAIL_FAKE_PROVIDERS:-0}
    volumes:
      - ../config:/opt/aivoicemail/config:ro
      - ../secrets:/opt/aivoicemail/secrets:ro
      - ${AIVM_SPOOL_DIR:-/srv/aivoicemail/spool}:/srv/aivoicemail/spool
      - data:/var/lib/aivoicemail
    tmpfs:
      - /run/aivoicemail:uid=10001,gid=5060,mode=0700
      - /tmp:uid=10001,gid=5060,mode=0700

  tools:
    <<: *hardening
    build: {context: .., dockerfile: Dockerfile}
    image: aivoicemail-worker:0.1.0
    profiles: [tools]
    network_mode: host
    env_file: [../.env]
    volumes:
      - ../config:/opt/aivoicemail/config:ro
      - ../overrides:/opt/aivoicemail/overrides:ro
      - ../generated:/opt/aivoicemail/generated
      - data:/var/lib/aivoicemail
    tmpfs:
      - /tmp:uid=10001,gid=5060,mode=0700

  testcall:
    <<: *hardening
    build: {context: .., dockerfile: Dockerfile}
    image: aivoicemail-worker:0.1.0
    profiles: [tools]
    network_mode: host
    entrypoint: ["aivoicemail", "test-call"]
    cap_add: [NET_RAW]   # sipp's RTP port range checks (-min_rtp_port/-max_rtp_port) open a raw
                         # socket; a file capability set on /usr/bin/sipp at build time is the only
                         # thing in the image that can use it - "tools" and "worker" never get this
    security_opt: []     # no-new-privileges would block that file capability from taking effect even
                         # with cap_add above; only this service (never internet-facing, and its root
                         # filesystem stays read-only so no elevated binary can be added at runtime)
                         # clears it - "tools" and "worker" keep the full anchor
    env_file: [../.env]
    volumes:
      - ../config:/opt/aivoicemail/config:ro
      - ../overrides:/opt/aivoicemail/overrides:ro
      - ../generated:/opt/aivoicemail/generated
      - data:/var/lib/aivoicemail
    tmpfs:
      - /tmp:uid=10001,gid=5060,mode=0700

volumes:
  data:
