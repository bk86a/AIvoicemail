# Processing host: the worker service, plus the "tools" profile that runs the aivoicemail CLI
# (./aivm <command>). Single host: included by deploy/compose.yaml. Split mode: run this file alone.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:5060"
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  worker:
    <<: *hardening
    build: {context: .., dockerfile: Dockerfile}
    image: aivoicemail-worker:0.1.0
    restart: unless-stopped
    env_file: [../.env]
    environment:
      AIVOICEMAIL_FAKE_PROVIDERS: ${AIVOICEMAIL_FAKE_PROVIDERS:-0}
    volumes:
      - ../config:/opt/aivoicemail/config:ro
      - ../secrets:/opt/aivoicemail/secrets:ro
      - ${AIVM_SPOOL_DIR:-/srv/aivoicemail/spool}:/srv/aivoicemail/spool
      - data:/var/lib/aivoicemail
    tmpfs:
      - /run/aivoicemail:uid=10001,gid=5060,mode=0700
      - /tmp:uid=10001,gid=5060,mode=0700

  tools:
    <<: *hardening
    build: {context: .., dockerfile: Dockerfile}
    image: aivoicemail-worker:0.1.0
    profiles: [tools]
    network_mode: host
    pid: host             # sipp (test-call) derives its Call-ID/branch from its own PID; as a fresh
                         # container's PID 2 every run, a second run would reuse the first and PJSIP
                         # would answer its BYE from the still-cached first transaction (same reason
                         # tests/sipp/run_harness.sh runs SIPp with --pid host)
    cap_add: [NET_RAW]   # sipp (test-call) needs a raw socket for its RTP port range checks; file
                         # capability set on /usr/bin/sipp at build time, nothing else gains it
    security_opt: []     # no-new-privileges would block that file capability from taking effect even
                         # with cap_add above; safe here since the image root filesystem is read-only,
                         # so no elevated binary can be added to it at runtime
    env_file: [../.env]
    volumes:
      - ../config:/opt/aivoicemail/config:ro
      - ../overrides:/opt/aivoicemail/overrides:ro
      - ../generated:/opt/aivoicemail/generated
      - data:/var/lib/aivoicemail
    tmpfs:
      - /tmp:uid=10001,gid=5060,mode=0700

volumes:
  data:
